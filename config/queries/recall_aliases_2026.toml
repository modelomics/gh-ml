# Focused retrieval aliases supported by the 2026 PWC absence audit.
# These queries retain broad method-family provenance and do not name projects.

[[queries]]
id = "recall26.long-tailed-recognition"
q = "\"long-tailed recognition\" in:description,readme"
domains = ["computer-vision", "imbalanced-learning", "machine-learning"]
methods = ["long-tailed-learning", "classification", "recognition"]

