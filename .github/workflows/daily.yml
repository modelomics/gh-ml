name: Daily GitHub repository collection

on:
  # Avoid the top of the hour, when GitHub Actions is most congested.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      snapshot_only:
        description: "Publish the current-view snapshot without running collectors"
        required: false
        type: boolean
        default: false
      recent_max_requests:
        description: "Maximum Search requests for recent collection (1–600)"
        required: false
        type: number
        default: 600
      sample_max_requests:
        description: "Maximum Search requests for breadth sample (1–500)"
        required: false
        type: number
        default: 500
      backfill_max_requests:
        description: "Maximum Search requests for fair historical backfill (1–700)"
        required: false
        type: number
        default: 700
      historical_sample_max_requests:
        description: "Maximum Search requests for annual historical sample (1–200)"
        required: false
        type: number
        default: 200
      census_max_pages:
        description: "Maximum GitHub repository census pages (1–100)"
        required: false
        type: number
        default: 50
      topic_max_pages:
        description: "Maximum GitHub topic pages to collect (1–100; daily default 68)"
        required: false
        type: number
        default: 68
      hf_papers_max_pages:
        description: "Maximum Hugging Face Daily Papers pages to collect (1–100; daily default 20)"
        required: false
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: gh-ml-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SAMPLE_MAX_REQUESTS: ${{ github.event_name == 'schedule' && 500 || inputs.sample_max_requests }}
      RECENT_MAX_REQUESTS: ${{ github.event_name == 'schedule' && 600 || inputs.recent_max_requests }}
      HISTORICAL_SAMPLE_MAX_REQUESTS: ${{ github.event_name == 'schedule' && 200 || inputs.historical_sample_max_requests }}
      BACKFILL_MAX_REQUESTS: ${{ github.event_name == 'schedule' && 700 || inputs.backfill_max_requests }}
      CENSUS_MAX_PAGES: ${{ github.event_name == 'schedule' && 50 || inputs.census_max_pages }}
      TOPIC_MAX_PAGES: ${{ github.event_name == 'schedule' && 68 || inputs.topic_max_pages }}
      HF_PAPERS_MAX_PAGES: ${{ github.event_name == 'schedule' && 20 || inputs.hf_papers_max_pages }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate request limits
        if: ${{ !inputs.snapshot_only }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          limits = {
              "SAMPLE_MAX_REQUESTS": (1, 500),
              "RECENT_MAX_REQUESTS": (1, 600),
              "HISTORICAL_SAMPLE_MAX_REQUESTS": (1, 200),
              "BACKFILL_MAX_REQUESTS": (1, 700),
              "CENSUS_MAX_PAGES": (1, 100),
              "TOPIC_MAX_PAGES": (1, 100),
              "HF_PAPERS_MAX_PAGES": (1, 100),
          }
          for name, (minimum, maximum) in limits.items():
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9]+", value) or not minimum <= int(value) <= maximum:
                  print(f"{name} must be an integer from {minimum} to {maximum}", file=sys.stderr)
                  sys.exit(1)
          PY
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra parquet
      - name: Run tests
        run: uv run --frozen pytest
      - name: Verify Hugging Face publishing credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: |
          uv run --frozen python -c 'import os; from huggingface_hub import get_token; token = os.environ.get("HF_TOKEN") or get_token(); assert token, "No Hugging Face token available from HF_TOKEN or the configured GitHub OIDC trusted publisher"'
      - name: Sample broad repository queries
        if: ${{ !inputs.snapshot_only }}
        id: sample
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml sample --max-requests "$SAMPLE_MAX_REQUESTS" --since-days 1
      - name: Collect recent repositories
        if: ${{ !inputs.snapshot_only }}
        id: recent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml run --max-requests "$RECENT_MAX_REQUESTS"
      - name: Sample historical repositories by year
        if: ${{ !inputs.snapshot_only }}
        id: historical_sample
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml historical-sample --max-requests "$HISTORICAL_SAMPLE_MAX_REQUESTS"
      - name: Fair backfill historical repositories
        if: ${{ !inputs.snapshot_only }}
        id: backfill
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml backfill-fair --max-requests "$BACKFILL_MAX_REQUESTS"
      - name: Collect bounded repository census
        if: ${{ !inputs.snapshot_only }}
        id: census
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml census-daily --work-dir "$RUNNER_TEMP/gh-ml-census" --max-pages "$CENSUS_MAX_PAGES"
      - name: Collect broad GitHub topics
        if: ${{ !inputs.snapshot_only }}
        id: topic_breadth
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml topic-breadth-daily --work-dir "$RUNNER_TEMP/gh-ml-topic-breadth" --max-pages "$TOPIC_MAX_PAGES"
      - name: Enrich selected repositories with README evidence
        if: ${{ !inputs.snapshot_only }}
        id: readme
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml readme-enrich --max-requests 150
      - name: Collect Hugging Face Daily Papers links
        if: ${{ !inputs.snapshot_only }}
        id: hf_papers
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen gh-ml hf-papers-daily --work-dir "$RUNNER_TEMP/gh-ml-hf-papers" --max-pages "$HF_PAPERS_MAX_PAGES"
      - name: Publish current-view snapshot
        id: snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OIDC_RESOURCE: datasets/modelomics/gh-ml
        run: uv run --frozen --extra parquet gh-ml publish-current-view --work-dir "$RUNNER_TEMP/gh-ml-current-view"
      - name: Fail if any collection or snapshot step failed
        if: always() && (steps.sample.outcome == 'failure' || steps.recent.outcome == 'failure' || steps.historical_sample.outcome == 'failure' || steps.backfill.outcome == 'failure' || steps.census.outcome == 'failure' || steps.readme.outcome == 'failure' || steps.topic_breadth.outcome == 'failure' || steps.hf_papers.outcome == 'failure' || steps.snapshot.outcome == 'failure')
        run: exit 1
