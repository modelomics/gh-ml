[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gh-ml"
version = "0.1.0"
description = "A daily registry of GitHub projects presenting novel machine learning work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=1.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
# Dependencies imported by the complete test suite. Keep this lean: the tests
# use fake encoders and do not need sentence-transformers or model weights.
test = [
  "pytest>=8.3",
  "numpy>=1.24",
  "pyarrow>=20",
  "scikit-learn>=1.5,<2",
  "faiss-cpu==1.12.0",
  "duckdb==1.5.6",
]
pwc = [
  "datasets>=3.3,<5",
]
parquet = [
  "pyarrow>=20",
]
triage = [
  "scikit-learn>=1.5,<2",
]
semantic = [
  "sentence-transformers==5.7.0",
  "tokenizers==0.22.2",
  "safetensors==0.8.0",
  "faiss-cpu==1.12.0",
]
publication = [
  "duckdb==1.5.6",
]

[project.scripts]
gh-ml = "gh_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
