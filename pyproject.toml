[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gh-ml"
version = "0.1.0"
description = "A daily registry of GitHub projects presenting novel machine learning work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=1.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
gh-ml = "gh_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
